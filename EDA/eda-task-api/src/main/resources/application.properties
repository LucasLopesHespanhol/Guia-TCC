spring.application.name=eda-task-api
server.port=8081
server.address=127.0.0.1

spring.datasource.url=jdbc:h2:mem:edadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=10000

server.tomcat.accept-count=8192
server.tomcat.max-keep-alive-requests=-1

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always

# Broker externo
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=${EDA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=tcc
spring.rabbitmq.password=default
spring.rabbitmq.connection-timeout=10s

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false

spring.rabbitmq.listener.type=simple
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=50
spring.rabbitmq.listener.simple.max-concurrency=50
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false

logging.level.br.edu.unesc.tcc.eda_task_api.events=WARN

# Identificacao da execucao nos eventos
eda.run-id=desenvolvimento