info:
  name: "04 - Get created task"
  type: http
  seq: 4

http:
  method: GET
  url: "http://localhost:8081/tarefas/{{taskId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("taskId")) {
          throw new Error("Execute o passo anterior para obter taskId. Nao digite um id fixo.");
        }
    - type: tests
      code: |-
        test("200: campos da tarefa conferidos", function () {
          expect(res.status).to.equal(200);
          expect(res.body).to.deep.equal(Object.assign({id: Number(bru.getVar("taskId"))}, {"titulo": "Manual EDA task", "descricao": "Created with Bruno", "prioridade": "MEDIA", "status": "ABERTA", "dataLimite": "2020-01-15"}));
        });

settings:
  encodeUrl: true
  timeout: 20000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
