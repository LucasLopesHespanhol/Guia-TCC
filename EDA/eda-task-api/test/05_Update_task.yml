info:
  name: "05 - Update task"
  type: http
  seq: 5

http:
  method: PUT
  url: "http://localhost:8081/tarefas/{{taskId}}"
  body:
    type: json
    data: |-
      {
        "titulo": "Updated EDA task",
        "descricao": null,
        "prioridade": "ALTA",
        "status": "CONCLUIDA",
        "dataLimite": "2020-03-10"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("taskId")) {
          throw new Error("Execute o passo anterior para obter taskId. Nao digite um id fixo.");
        }
        bru.setVar("updateSubmissionId", "");
    - type: after-response
      code: |-
        if (res.status === 202 && res.body && res.body.id) {
          bru.setVar("updateSubmissionId", res.body.id);
        }
    - type: tests
      code: |-
        test("202: pedido aceito com protocolo", function () {
          expect(res.status).to.equal(202);
          expect(res.body.id).to.be.a("string");
          expect(res.getHeader("Location")).to.equal("/solicitacoes/" + res.body.id);
        });

settings:
  encodeUrl: true
  timeout: 20000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
