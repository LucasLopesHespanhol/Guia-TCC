info:
  name: "10 - Get deleted task"
  type: http
  seq: 10

http:
  method: GET
  url: "http://localhost:8081/tarefas/{{taskId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("taskId")) {
          throw new Error("Execute o passo anterior para obter taskId. Nao digite um id fixo.");
        }
    - type: tests
      code: |-
        test("404: tarefa removida", function () {
          expect(res.status).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 20000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
