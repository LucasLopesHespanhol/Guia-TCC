spring.application.name=reactive-task-api

spring.r2dbc.url=r2dbc:h2:mem:///taskdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Pool R2DBC: configuração operacional inicial
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=20
spring.r2dbc.pool.max-size=100
spring.r2dbc.pool.max-acquire-time=10s
spring.r2dbc.pool.max-create-connection-time=10s
spring.r2dbc.pool.max-validation-time=10s
spring.r2dbc.pool.acquire-retry=0

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=tcc
spring.rabbitmq.password=default
spring.rabbitmq.connection-timeout=10s
spring.rabbitmq.virtual-host=reactive

management.endpoint.health.show-components=always

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false

spring.rabbitmq.listener.simple.concurrency=8
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false

app.messaging.consumer-concurrency=8
app.messaging.command-prefetch=20
app.messaging.reply-prefetch=250
app.messaging.max-pending-requests=5000
app.messaging.command-queue=reactive.tasks.commands.capacity
app.messaging.command-queue-capacity=5000
app.messaging.reply-queue-capacity=5000

app.messaging.request-threads=16
app.messaging.request-queue-capacity=5000
app.messaging.reply-threads=8
app.messaging.reply-queue-capacity-per-thread=5000

app.http.accept-backlog=8192

app.messaging.rpc-timeout-seconds=30